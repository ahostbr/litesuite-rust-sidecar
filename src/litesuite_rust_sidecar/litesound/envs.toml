# How each of LiteSound's engine environments is built (C3). They cannot be ordinary
# dependencies: chatterbox-tts pins torch==2.6.0 and stable-audio-tools torch==2.13.0, neither of
# which can drive an RTX 50-series card, and the vendored VibeVoice loader needs
# transformers==4.51.3. So each environment is built by ordered steps: a CUDA-capable torch first
# from the PyTorch index, then the package with --no-deps or a curated list, or the package freely
# and then torch forced back last.
#
# Each step is the argument list given to `uv pip` (with --python pointing at the environment).
# "{torch_index}" is replaced by the environment's torch_index: the index is data, not code.
#
# Sources: speech, vibevoice and stableaudio copy ENVS / SPECS of LiteSound's
# scripts/setup_speech_envs.py; main copies its python:setup script and python/requirements.txt.

[envs.main]
python = "3.11"
torch_index = "https://download.pytorch.org/whl/nightly/cu128"
steps = [
    ["install", "--pre", "torch", "torchaudio", "--index-url", "{torch_index}"],
    # python/requirements.txt minus audiocraft>=1.3.0. That line cannot resolve here: audiocraft
    # depends on torchaudio<2.1.2 and this list needs torchaudio>=2.6.0. Nothing in this package
    # imports audiocraft: MusicGen loads through transformers (MusicgenForConditionalGeneration)
    # and Bark through suno-bark.
    ["install", "fastapi>=0.115.0", "uvicorn[standard]>=0.34.0", "pydantic>=2.0.0", "huggingface_hub>=0.28.0",
     "diffusers>=0.38.0", "torchsde>=0.2.6", "transformers>=4.49.0", "accelerate>=1.6.0",
     "torchaudio>=2.6.0", "suno-bark>=0.0.1", "scipy>=1.15.0", "soundfile>=0.13.0", "anyio>=4.14.2",
     "certifi>=2026.10.19", "idna>=3.15", "pillow>=13.0.0", "python-multipart>=0.0.31", "starlette>=1.3.1",
     "urllib3>=2.8.0"],
]
verify = ""

[envs.speech]
python = "3.11"
torch_index = "https://download.pytorch.org/whl/nightly/cu128"
backends = ["chatterbox"]
steps = [
    # torch FIRST so chatterbox-tts's torch==2.6.0 pin can never apply.
    ["install", "--pre", "torch", "torchaudio", "--index-url", "{torch_index}"],
    ["install", "--no-deps", "chatterbox-tts"],
    # Its real runtime deps, minus torch/torchaudio (kept above) and minus gradio (demo UI only).
    ["install", "numpy<2.0.0,>=1.24.0", "librosa==0.11.0", "s3tokenizer", "transformers==5.2.0",
     "diffusers==0.29.0", "resemble-perth>=1.0.0", "conformer==0.3.2", "safetensors==0.5.3", "spacy-pkuseg",
     "pykakasi==2.3.0", "pyloudnorm", "omegaconf", "scipy"],
    ["install", "fastapi", "uvicorn"],
]
verify = "from chatterbox.tts import ChatterboxTTS"

[envs.vibevoice]
python = "3.11"
torch_index = "https://download.pytorch.org/whl/nightly/cu128"
backends = ["vibevoice"]
steps = [
    ["install", "--pre", "torch", "torchaudio", "--index-url", "{torch_index}"],
    # The `vibevoice` package on PyPI is deliberately NOT installed (an unaffiliated third-party
    # copy); the loader is vendored from the pinned first-party commit: vendor/vibevoice/PROVENANCE.md.
    ["install", "transformers==4.51.3", "diffusers", "librosa", "soundfile", "tqdm", "accelerate"],
    ["install", "fastapi", "uvicorn"],
]
# Imports the VENDORED loader, so this also proves the vendor tree is intact.
verify = "import sys; sys.path.insert(0, r'{vendor}'); from vibevoice.modular.modeling_vibevoice_streaming_inference import VibeVoiceStreamingForConditionalGenerationInference"

[envs.stableaudio]
python = "3.11"
torch_index = "https://download.pytorch.org/whl/nightly/cu128"
backends = ["stable-audio-small"]
steps = [
    # Too big to hand-resolve: install freely, then override torch LAST.
    ["install", "stable-audio-tools"],
    ["install", "--pre", "--force-reinstall", "--no-deps", "torch", "torchaudio", "--index-url", "{torch_index}"],
    # Must come from the SAME index as torch or its C++ extension ABI-mismatches.
    ["install", "--pre", "--force-reinstall", "--no-deps", "torchvision", "--index-url", "{torch_index}"],
    # clip-anytorch imports pkg_resources, dropped in setuptools 81.
    ["install", "setuptools<81"],
    ["install", "fastapi", "uvicorn"],
]
verify = "from stable_audio_tools import get_pretrained_model"

[envs.yue]
# No ordered recipe is recorded for YuE2's environment (LiteSound T777 records only its result:
# Python 3.12.9, torch 2.10.0+cu128 from the PyTorch index, yue2 importable), and it needs
# Python 3.12 while this package is 3.11. Until a recipe is measured it is not installable here.
checkout_only = true
reason = "YuE2's environment has no recorded install recipe yet; it runs from a LiteSound checkout only."
