[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litesuite-rust-sidecar"
version = "0.1.0"
description = "The Python engines the Rust Lite apps start beside themselves. This version holds LiteSound's audio engine."
readme = "README.md"
# The engine runs on CPython 3.11 today (python/.venv is 3.11.9).
requires-python = ">=3.11,<3.12"
# MIT (Ryan). An SPDX expression (PEP 639, setuptools >= 77); with it, setuptools refuses the
# old "License ::" classifier, so none is given.
license = "MIT"
license-files = ["LICENSE"]
# No required dependencies: each app has an extra, and torch and the model libraries are
# installed per environment by ordered steps, not as dependencies (sub-w6-sidecar.md, C1 and C3).
dependencies = []

[project.optional-dependencies]
# What LiteSound's server needs to start and answer /health, /status and the hub routes.
# The floors are those of python/requirements.txt.
litesound = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "huggingface_hub>=0.28.0",
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "idna>=3.15",
    "pillow>=13.0.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"litesuite_rust_sidecar.litesound" = ["vendor/**/*", "envs.toml"]
